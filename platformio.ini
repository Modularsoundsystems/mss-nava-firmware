; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nava]
platform = atmelavr
board = ATmega1284
framework = arduino

extra_scripts = pre:tools/gitrev.py

board_build.f_cpu = 16000000L
board_build.variant = standard
board_hardware.oscillator = external

; [3G] MIDI RX headroom for the SysEx restore, which arrives at the full line
; rate while every page message costs a blocking EEPROM write. The core defaults
; to 64 on this part; 128 doubles the slack for 64 bytes of RAM.
;
; 128 and NOT 256, deliberately: the vendored MIDI v3.2 parser throws the whole
; buffer away when available() reads exactly 128 - a 2011 idiom, when
; Serial.flush() discarded the RX buffer, which it has not done since Arduino
; 1.0. A 128-byte ring can only ever report 127, so that branch stays
; unreachable. At 256 it becomes reachable and flush() would no longer even do
; what the code there thinks it does.
build_flags = -DSERIAL_RX_BUFFER_SIZE=128

upload_protocol = stk500v1
upload_port = COM4
upload_speed = 19200
upload_flags =
    -e
;    -b 19200
    -B 125kHz